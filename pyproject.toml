[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-brain"
version = "0.1.0"
description = "TradingBrain — modular AI-assisted trading and investment intelligence system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mithun" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "redis>=5.2",
    "anthropic>=0.40",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = [
    "apps",
    "backtesting",
    "brain",
    "quant",
    "data",
    "integrations",
    "models",
    "paper_trading",
    "config",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern is `param: T = Depends(...)` --
# these calls are safe to evaluate at import time, unlike the mutable
# default arguments B008 otherwise guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
